<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer 🍅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tomato-bg">
            <svg viewBox="0 0 200 200" class="tomato-svg">
                <ellipse cx="100" cy="110" rx="85" ry="75" class="tomato-body"/>
                <ellipse cx="70" cy="85" rx="20" ry="15" class="tomato-shine"/>
                <path d="M95 35 Q100 20 105 35 Q110 25 100 20 Q90 25 95 35" class="tomato-stem"/>
                <path d="M100 35 Q120 25 135 35 Q120 40 100 38" class="tomato-leaf"/>
                <path d="M100 35 Q80 25 65 35 Q80 40 100 38" class="tomato-leaf"/>
            </svg>
        </div>

        <div class="timer-content">
            <h1 class="title">🍅 Pomodoro</h1>
            
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                <button class="mode-btn" data-mode="shortBreak">Pausa Curta</button>
                <button class="mode-btn" data-mode="longBreak">Pausa Longa</button>
            </div>

            <div class="timer-display">
                <div class="progress-ring">
                    <svg class="ring-svg" viewBox="0 0 200 200">
                        <circle class="ring-bg" cx="100" cy="100" r="88"/>
                        <circle class="ring-progress" cx="100" cy="100" r="88"/>
                    </svg>
                </div>
                <div class="time-text" id="timeDisplay">25:00</div>
            </div>

            <div class="status" id="statusText">Hora de focar!</div>

            <div class="control-buttons">
                <button class="control-btn primary" id="startPauseBtn">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">Iniciar</span>
                </button>
                <button class="control-btn secondary" id="resetBtn">
                    <span class="btn-icon">↻</span>
                    <span class="btn-text">Reiniciar</span>
                </button>
            </div>

            <div class="session-counter">
                <div class="tomato-icon">🍅</div>
                <span id="sessionCount">0</span> / 4 sessões
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvsR3fV3Wj7oRLrzo1jE=" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
